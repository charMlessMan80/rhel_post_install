---
- name: Set root shell to /sbin/nologin
  ansible.builtin.user:
    name: root
    shell: /sbin/nologin

- name: Lock root account password
  ansible.builtin.user:
    name: root
    password_lock: true

- name: Restrict su to wheel group only
  ansible.builtin.lineinfile:
    path: /etc/pam.d/su
    regexp: '^#?\s*auth\s+required\s+pam_wheel\.so\s+use_uid'
    line: "auth           required        pam_wheel.so use_uid"

- name: Restrict access to root cron
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - /etc/crontab
    - /var/spool/cron/root
  failed_when: false

- name: Disable root login on all TTYs via securetty
  ansible.builtin.copy:
    content: ""
    dest: /etc/securetty
    owner: root
    group: root
    mode: "0600"
    force: true

- name: Verify root shell setting
  ansible.builtin.command: getent passwd root
  register: root_passwd
  changed_when: false

- name: Display root account status
  ansible.builtin.debug:
    var: root_passwd.stdout_lines
