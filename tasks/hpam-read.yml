---
# Ansible port of hpam.sh
# Retrieves a credential from BeyondTrust Password Safe (HPAM).
#
# Callable as a "function": include this file with ansible.builtin.include_tasks
# and optionally pass call-specific vars (all fall back to the centralized
# group_vars/all.yml hpam_* defaults when omitted):
#   hpam_read_secret_title, hpam_read_folder_path, hpam_read_environment_code
# It returns its result in the hpam_read_result fact:
#   hpam_read_result.username, hpam_read_result.password, hpam_read_result.secret_id
#
# Example:
#   - ansible.builtin.include_tasks: tasks/hpam-read.yml
#     vars:
#       hpam_read_secret_title: "OTHER ADMIN"
#   - ansible.builtin.debug:
#       var: hpam_read_result.password
#
# Shell -> Ansible translations:
#   - curl --negotiate -u : (Kerberos)  -> uri module with use_gssapi: true
#   - curl cookie jar (-c / -b)         -> capture/replay signin.cookies_string
#   - id -un                            -> hpam_operator (control-node lookup)
#   - jq field extraction               -> registered .json results
#   - trap cleanup EXIT (sign-out)      -> block / always
#
# Requirements on the node that runs this play:
#   - python3-gssapi (for use_gssapi / Kerberos negotiate auth)
#   - a valid Kerberos ticket (kinit) for the running user

- name: "Compute HPAM derived connection facts"
  ansible.builtin.set_fact:
    hpam_run_as_user: "{{ hpam_operator }}@{{ hpam_run_as_domain }}"
    hpam_api_key_url: "{{ hpam_api_key_service_url }}/API_{{ hpam_operator }}"

# ===== Resolve call parameters (fall back to centralized group vars) =====
- name: "Set HPAM read call parameters"
  ansible.builtin.set_fact:
    hpam_read_environment_code: "{{ hpam_read_environment_code | default(hpam_environment_code) }}"
    hpam_read_secret_title: "{{ hpam_read_secret_title | default(hpam_secret_title) }}"
    hpam_read_folder_path: "{{ hpam_read_folder_path | default(hpam_secrets_safe_folder_path) }}"

# ===== Derived connection facts =====
- name: "Resolve HPAM base URL for the target environment"
  ansible.builtin.set_fact:
    hpam_base_url: "{{ hpam_base_url_qa if hpam_read_environment_code == 'Q' else hpam_base_url_prod }}"

- name: "Compute HPAM derived connection facts"
  ansible.builtin.set_fact:
    hpam_run_as_user: "{{ hpam_operator }}@{{ hpam_run_as_domain }}"
    hpam_api_key_url: "{{ hpam_api_key_service_url }}/API_{{ hpam_operator }}"
    hpam_signin_url: "{{ hpam_base_url }}/Auth/SignAppin"
    hpam_get_secrets_url: "{{ hpam_base_url }}/Secrets-Safe/Secrets"
    hpam_signout_url: "{{ hpam_base_url }}/Auth/Signout"

# ===== Get API key for the current user =====
- name: "Retrieve API key for the current user"
  ansible.builtin.uri:
    url: "{{ hpam_api_key_url }}"
    method: GET
    use_gssapi: true
    validate_certs: false
    return_content: true
  register: hpam_api_key_response
  no_log: true

- name: "Validate API key was retrieved"
  ansible.builtin.assert:
    that:
      - hpam_api_key_response.json is defined
      - hpam_api_key_response.json.Value is defined
      - hpam_api_key_response.json.Value | length > 0
    fail_msg: "[-] Failed to retrieve API key"
    success_msg: "API key retrieved."

# ===== Construct Authentication Header =====
- name: "Construct authentication header"
  ansible.builtin.set_fact:
    hpam_auth_header: >-
      {{ 'PS-Auth key=' ~ hpam_api_key_response.json.Value ~ '; runas=' ~ hpam_run_as_user ~ ';'
         ~ (' pwd=[' ~ hpam_run_as_password ~ '];' if hpam_run_as_password | length > 0 else '') }}
  no_log: true

# Everything between sign-in and sign-out runs in a block so the "always"
# section guarantees the sign-out, mirroring the shell script's EXIT trap.
- name: "Authenticated HPAM session"
  block:
    # ===== Authentication Request =====
    - name: "Authenticate to HPAM"
      ansible.builtin.uri:
        url: "{{ hpam_signin_url }}"
        method: POST
        headers:
          Authorization: "{{ hpam_auth_header }}"
        validate_certs: false
        status_code: [200, 201]
      register: hpam_signin
      no_log: true

    - name: "Validate authentication"
      ansible.builtin.assert:
        that:
          - hpam_signin.json is defined
          - hpam_signin.json.UserId is defined
          - hpam_signin.json.UserId | string | length > 0
        fail_msg: "[-] Authentication failed"
        success_msg: "Authentication successful. UserId: {{ hpam_signin.json.UserId | default('?') }}"

    # ===== Retrieve Secret ID =====
    - name: "Search for secret by title and path"
      ansible.builtin.uri:
        url: "{{ hpam_get_secrets_url }}?Title={{ hpam_read_secret_title | urlencode }}&Path={{ hpam_read_folder_path | urlencode }}"
        method: GET
        headers:
          Authorization: "{{ hpam_auth_header }}"
          Cookie: "{{ hpam_signin.cookies_string }}"
        validate_certs: false
        return_content: true
      register: hpam_secret_search
      no_log: true

    - name: "Extract SecretId from search result"
      ansible.builtin.set_fact:
        # The endpoint may return an array of matches or a single object;
        # take the first element of an array, else the object itself.
        # NOTE: 'is mapping' (not 'is sequence') distinguishes the two,
        # because Jinja2 considers dicts to be sequences as well.
        hpam_secret_id: >-
          {{ (hpam_secret_search.json | default({})).Id | default('')
             if hpam_secret_search.json | default({}) is mapping
             else (hpam_secret_search.json | default([]) | first | default({})).Id | default('') }}

    - name: "Validate secret was found"
      ansible.builtin.assert:
        that:
          - hpam_secret_id | string | length > 0
        fail_msg: "[-] Secret not found"
        success_msg: "Secret found. SecretId: {{ hpam_secret_id }}"

    # ===== Retrieve Secret Details =====
    - name: "Fetch secret details"
      ansible.builtin.uri:
        url: "{{ hpam_base_url }}/Secrets-Safe/secrets/{{ hpam_secret_id }}"
        method: GET
        headers:
          Authorization: "{{ hpam_auth_header }}"
          Cookie: "{{ hpam_signin.cookies_string }}"
        validate_certs: false
        return_content: true
      register: hpam_secret_details
      no_log: true

    - name: "Validate password was retrieved"
      ansible.builtin.assert:
        that:
          - hpam_secret_details.json is defined
          - hpam_secret_details.json.Password is defined
          - hpam_secret_details.json.Password | length > 0
        fail_msg: "[-] Failed to retrieve password"
        success_msg: "Secret details retrieved."

    # ===== RETURN VALUE =====
    # "Return" the result to the caller as a fact, like a function's return value.
    - name: "Return retrieved credential"
      ansible.builtin.set_fact:
        hpam_read_result:
          username: "{{ hpam_secret_details.json.Username }}"
          password: "{{ hpam_secret_details.json.Password }}"
          secret_id: "{{ hpam_secret_id }}"
      no_log: true

  always:
    # ===== Disconnect from HPAM =====
    # Runs even when a task in the block fails, mirroring the shell
    # script's EXIT trap. Only attempted once a session cookie exists.
    - name: "Sign out of HPAM"
      ansible.builtin.uri:
        url: "{{ hpam_signout_url }}"
        method: POST
        headers:
          Authorization: "{{ hpam_auth_header }}"
          Cookie: "{{ hpam_signin.cookies_string }}"
        validate_certs: false
        status_code: [200, 204]
      when:
        - hpam_signin.cookies_string is defined
        - hpam_signin.cookies_string | length > 0
      failed_when: false
      no_log: true
