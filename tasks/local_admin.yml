---
# Provision the local admin credential in HPAM (control node operation, hence
# delegate_to: localhost) instead of relying on a pre-supplied local_admin_password.
# ignore_errors is valid on a dynamic include but is not passed to included tasks; only apply propagates it.
- name: Check whether an HPAM entry already exists for the local admin account
  ansible.builtin.include_tasks:
    file: tasks/hpam-read.yml
    apply:
      delegate_to: localhost
      become: false
      ignore_errors: true
  vars:
    hpam_read_secret_title: "{{ local_admin_user }}"

- name: Create HPAM entry for the local admin account
  ansible.builtin.include_tasks:
    file: tasks/hpam-write.yml
    apply:
      delegate_to: localhost
      become: false
  when: hpam_read_result is none
  vars:
    hpam_write_new_secret_title: "{{ local_admin_user }}"
    hpam_write_new_username: "{{ local_admin_user }}"

- name: Retrieve local admin password from HPAM
  ansible.builtin.include_tasks:
    file: tasks/hpam-read.yml
    apply:
      delegate_to: localhost
      become: false
  vars:
    hpam_read_secret_title: "{{ local_admin_user }}"

- name: Set local admin password from HPAM
  ansible.builtin.set_fact:
    local_admin_password: "{{ hpam_read_result.password }}"
  no_log: true

- name: Create local admin user
  ansible.builtin.user:
    name: "{{ local_admin_user | default('localadmin') }}"
    password: "{{ local_admin_password | password_hash('sha512') }}"
    groups: wheel
    append: true
    shell: /bin/bash
    create_home: true
    state: present

- name: Ensure wheel group has sudo privileges
  ansible.builtin.lineinfile:
    path: "/etc/sudoers.d/{{ local_admin_user | default('localadmin') }}"
    line: "{{ local_admin_user | default('localadmin') }} ALL=(ALL) NOPASSWD: ALL"
    create: true
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"

- name: Add SSH authorized key for local admin
  ansible.posix.authorized_key:
    user: "{{ local_admin_user | default('localadmin') }}"
    key: "{{ local_admin_ssh_key }}"
    state: present
  when: local_admin_ssh_key is defined and local_admin_ssh_key | length > 0

- name: Verify local admin account
  ansible.builtin.command: "id {{ local_admin_user | default('localadmin') }}"
  register: admin_id
  changed_when: false

- name: Display local admin account info
  ansible.builtin.debug:
    var: admin_id.stdout_lines
