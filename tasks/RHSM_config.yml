---
- name: Configure RHSM proxy hostname in /etc/rhsm/rhsm.conf
  community.general.ini_file:
    path: /etc/rhsm/rhsm.conf
    section: server
    option: proxy_hostname
    value: "{{ rhsm_proxy_hostname | default('') }}"
    no_extra_spaces: true
    owner: root
    group: root
    mode: '0644'
  when: rhsm_proxy_hostname is defined and rhsm_proxy_hostname | length > 0

- name: Configure RHSM proxy port in /etc/rhsm/rhsm.conf
  community.general.ini_file:
    path: /etc/rhsm/rhsm.conf
    section: server
    option: proxy_port
    value: "{{ rhsm_proxy_port | default('') }}"
    no_extra_spaces: true
    owner: root
    group: root
    mode: '0644'
  when: rhsm_proxy_port is defined and rhsm_proxy_port | length > 0

- name: Check if system is already registered
  ansible.builtin.command: subscription-manager identity
  register: rhsm_identity
  changed_when: false
  failed_when: false

- name: Register with Red Hat Subscription Manager
  community.general.redhat_subscription:
    username: "{{ rhsm_username }}"
    password: "{{ rhsm_password }}"
    auto_attach: "{{ rhsm_auto_attach | default(true) }}"
    state: present
  when: rhsm_identity.rc != 0
  no_log: true

- name: Enable specific repositories
  community.general.rhsm_repository:
    name: "{{ item }}"
    state: enabled
  loop: "{{ rhsm_repos | default([]) }}"
  when: rhsm_repos is defined and rhsm_repos | length > 0

- name: Verify subscription status
  ansible.builtin.command: subscription-manager status
  register: rhsm_status
  changed_when: false

- name: Display subscription status
  ansible.builtin.debug:
    var: rhsm_status.stdout_lines
