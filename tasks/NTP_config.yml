---
- name: Install chrony
  ansible.builtin.dnf:
    name: chrony
    state: present

- name: Set timezone
  ansible.builtin.timezone:
    name: "{{ ntp_timezone | default('UTC') }}"

- name: Remove default pool/server entries
  ansible.builtin.lineinfile:
    path: /etc/chrony.conf
    regexp: "{{ item }}"
    state: absent
  loop:
    - '^pool\s+'
    - '^server\s+'

- name: Configure NTP servers
  ansible.builtin.lineinfile:
    path: /etc/chrony.conf
    line: "server {{ item }} iburst"
    insertafter: "^#.*server"
  loop: "{{ ntp_servers | default(['0.rhel.pool.ntp.org', '1.rhel.pool.ntp.org', '2.rhel.pool.ntp.org']) }}"

- name: Enable NTP makestep for initial large offset
  ansible.builtin.lineinfile:
    path: /etc/chrony.conf
    regexp: '^makestep'
    line: "makestep 1.0 3"

- name: Enable and restart chronyd
  ansible.builtin.service:
    name: chronyd
    state: restarted
    enabled: true

- name: Wait for chrony to sync
  ansible.builtin.command: chronyc tracking
  register: chrony_status
  changed_when: false

- name: Display chrony sync status
  ansible.builtin.debug:
    var: chrony_status.stdout_lines
