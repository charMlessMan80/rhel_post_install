---
# Fails fast, with actionable messages, on known blockers that would
# otherwise surface tens of tasks later as opaque errors.

# --- 2a. Effective SELinux context after privilege escalation ---------------
# ansible_selinux (from gather_facts) exposes status/type/mode/policyvers of
# the HOST policy, not the context of the current process, hence id -Z here.
- name: "Preflight: capture the effective SELinux context after escalation"
  ansible.builtin.command: id -Z
  register: preflight_selinux_context
  changed_when: false
  failed_when: false
  tags: [preflight]

# id -Z errors out and returns no context when SELinux is disabled; skip the
# check then, otherwise it would wrongly accuse the staff_u mapping.
- name: "Preflight: fail unless the escalated process runs unconfined_t"
  ansible.builtin.assert:
    that:
      - "'unconfined_t' in preflight_selinux_context.stdout"
    fail_msg: >-
      Effective SELinux context after privilege escalation is
      "{{ preflight_selinux_context.stdout }}", expected a type containing
      "unconfined_t". ansible_admin is likely mapped to the staff_u SELinux
      login on this TARGET's image, which keeps root in staff_t and denies
      dac_override (surfaces later as an opaque Errno 13). This is an IMAGE
      defect and cannot be fixed by this playbook: fix it on the image, or
      as a one-off on this target with:
        semanage login -a -s unconfined_u ansible_admin
    success_msg: "Effective SELinux context OK: {{ preflight_selinux_context.stdout }}"
  when: ansible_selinux.status | default('disabled') == 'enabled'
  tags: [preflight]

- name: "Preflight: report that the unconfined_t check was skipped"
  ansible.builtin.debug:
    msg: "SELinux is disabled on this host — the unconfined_t check was skipped."
  when: ansible_selinux.status | default('disabled') != 'enabled'
  tags: [preflight]

# --- 2b. List-type variables must not be explicitly null --------------------
# An empty YAML key (e.g. "dns_servers:") is `is defined` but None, and
# breaks `| length` with "object of type NoneType has no len()".
- name: "Preflight: reject list-type variables explicitly set to null"
  ansible.builtin.assert:
    that:
      - vars[item] is not none
    fail_msg: >-
      "{{ item }}" is defined but has no value (an empty "{{ item }}:" key,
      most likely in a group_vars file). This satisfies "is defined" but
      breaks "| length" with "object of type NoneType has no len()". Either
      give "{{ item }}" a real list value or delete the key entirely from
      the group_vars file that sets it.
    success_msg: "{{ item }} is either absent or has a value: OK"
  loop:
    - dns_servers
    - ad_dns_servers
    - dns_search_domains
    - ntp_servers
    - ssh_allowed_ips
    - ad_allowed_groups
    - rpm_pq_gpg_keys
  loop_control:
    label: "{{ item }}"
  when: item in vars
  tags: [preflight]

# --- 2c. Scalar variables must not be explicitly null ------------------------
# Same NoneType trap as 2b, but for scalars. An empty string ("") is a valid
# value here (e.g. adcs_server: "" disables the AD CS module) -- only null
# (an empty "key:") is rejected, so this must stay a `is not none` check,
# never a `| length` / truthiness check.
- name: "Preflight: reject scalar variables explicitly set to null"
  ansible.builtin.assert:
    that:
      - vars[item] is not none
    fail_msg: >-
      "{{ item }}" is defined but set to null (an empty "{{ item }}:" key,
      most likely in a group_vars file). An empty string is a valid value
      here (e.g. adcs_server: "" disables the AD CS module), but null is
      not. Either give "{{ item }}" a value (an empty string where
      applicable) or delete the key entirely from the group_vars file that
      sets it.
    success_msg: "{{ item }} is either absent or has a value: OK"
  loop:
    - ad_domain
    - ad_ou
    - adcs_server
    - local_admin_user
    - grub_superuser
    - hpam_operator
    - firewalld_enabled
    - verify_ptr_strict
    - verify_dns_timeout
  loop_control:
    label: "{{ item }}"
  when: item in vars
  tags: [preflight]

# --- 2c-bis. An active firewalld needs an SSH allow-list ---------------------
# firewall_config.yml removes the ssh service from the zone: with no
# ssh_allowed_ips, firewalld would end up active with no rule letting SSH in.
- name: "Preflight: fail if firewalld is enabled without ssh_allowed_ips"
  ansible.builtin.assert:
    that:
      - ssh_allowed_ips | default([], true) | length > 0
    fail_msg: >-
      firewalld_enabled is true but ssh_allowed_ips is empty or undefined:
      firewalld would be started with no rule allowing SSH. Either define
      ssh_allowed_ips or set firewalld_enabled: false (the default, filtering
      is then left to the network firewall).
    success_msg: "firewalld_enabled with {{ ssh_allowed_ips | default([], true) | length }} SSH source(s): OK"
  when: firewalld_enabled | default(false) | bool
  tags: [preflight]

# firewalld_enabled defaults to false, which stops firewalld: a host that
# relied on ssh_allowed_ips alone would silently lose its SSH restriction.
- name: "Preflight: fail if ssh_allowed_ips is set but firewalld_enabled is not true"
  ansible.builtin.assert:
    that:
      - firewalld_enabled | default(false) | bool
    fail_msg: >-
      ssh_allowed_ips is set ({{ ssh_allowed_ips | join(', ') }}) but
      firewalld_enabled is not true: firewalld would be stopped and the SSH
      restriction dropped. Set firewalld_enabled: true to keep the SSH
      restriction, or remove ssh_allowed_ips.
    quiet: true
  when: ssh_allowed_ips | default([], true) | length > 0
  tags: [preflight]

- name: "Preflight: fail unless verify_dns_timeout is a positive number of seconds"
  ansible.builtin.assert:
    that:
      - verify_dns_timeout | string is match('^[0-9]+$')
      - verify_dns_timeout | int > 0
    fail_msg: >-
      verify_dns_timeout is "{{ verify_dns_timeout }}", expected a positive
      integer (seconds to wait for the DNS A/PTR records, default 180).
    quiet: true
  when: verify_dns_timeout is defined and verify_dns_timeout is not none
  tags: [preflight]

# --- 2d. python3-gssapi must be importable on the CONTROL NODE ---------------
# The HPAM tasks run delegate_to: localhost with use_gssapi: true.
# If localhost is declared in the inventory with its own
# ansible_python_interpreter, that is what the uri module will use, not the
# interpreter running ansible-playbook; default() covers the implicit localhost.
- name: "Preflight: check python3-gssapi is importable on the control node"
  ansible.builtin.command:
    argv:
      - "{{ hostvars['localhost'].ansible_python_interpreter | default(ansible_playbook_python) }}"
      - -c
      - import gssapi
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  failed_when: false
  register: preflight_gssapi
  tags: [preflight]

# Not fatal: 2d/2e run on every invocation (always tag), including runs that
# never touch HPAM. The HPAM tasks themselves will fail with their own
# message if this warning is ignored.
- name: "Preflight: warn if python3-gssapi is missing on the control node"
  ansible.builtin.debug:
    msg: >-
      WARNING: python3-gssapi is not importable on the control node with
      "{{ hostvars['localhost'].ansible_python_interpreter | default(ansible_playbook_python) }}"
      (rc={{ preflight_gssapi.rc }}). The HPAM tasks (hpam-read.yml,
      hpam-write.yml, hpam-update.yml) run delegate_to: localhost with
      use_gssapi: true and require it. Install it on the CONTROL NODE,
      e.g.: dnf install python3-gssapi
      These HPAM tasks will fail if this run reaches them; the rest of the
      playbook can proceed.
  delegate_to: localhost
  become: false
  run_once: true
  when: preflight_gssapi.rc != 0
  tags: [preflight]

# --- 2e. A Kerberos ticket must be present on the CONTROL NODE ---------------
- name: "Preflight: check for a Kerberos ticket on the control node"
  ansible.builtin.command: klist -s
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  failed_when: false
  register: preflight_klist
  tags: [preflight]

# Not fatal: see the gssapi warning above for the rationale.
- name: "Preflight: warn if no Kerberos ticket is present on the control node"
  ansible.builtin.debug:
    msg: >-
      WARNING: No valid Kerberos ticket found on the control node (klist -s
      returned {{ preflight_klist.rc }}). The HPAM tasks use
      use_gssapi: true and need a ticket for the operator identified by
      hpam_operator. Run: kinit
      These HPAM tasks will fail if this run reaches them; the rest of the
      playbook can proceed.
  delegate_to: localhost
  become: false
  run_once: true
  when: preflight_klist.rc != 0
  tags: [preflight]
