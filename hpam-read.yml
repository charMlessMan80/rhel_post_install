---
# Retrieves a credential from BeyondTrust Password Safe (HPAM).
# Connection settings and the target secret are centralized in
# group_vars/all.yml (hpam_* variables); override with -e.
#
# Usage:
#   ansible-playbook hpam-read.yml
#   ansible-playbook hpam-read.yml -e hpam_environment_code=Q -e "hpam_secret_title=OTHER ADMIN"

- name: Retrieve credential from BeyondTrust Password Safe (HPAM)
  hosts: localhost
  connection: local
  gather_facts: true
  gather_subset:
    - "!all"
    - min

  tasks:
    - name: Include HPAM read tasks
      ansible.builtin.include_tasks: tasks/hpam-read.yml
